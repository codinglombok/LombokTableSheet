name: npm Publish

# Triggered ONLY via publish.yml (workflow_call) or a manual dispatch.
# It used to also listen for `release: published` directly — but publish.yml
# listens for that same event and then calls this workflow, so every release
# started two publish runs. The second one always failed with a 403 because
# the version was already on the registry.
on:
  workflow_call: {}
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g. latest, next)'
        default: 'latest'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
