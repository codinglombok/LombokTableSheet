name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: this block used to sit indented under `on:`, which made YAML parse it
# as an event named "permissions" — so the workflow ran with the repository's
# DEFAULT token permissions and this restriction never applied. It has to be a
# top-level key, as it is now.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
