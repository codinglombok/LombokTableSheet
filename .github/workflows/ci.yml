name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: this block used to sit indented under `on:`, which made YAML parse it
# as an event named "permissions" — so the workflow ran with the repository's
# DEFAULT token permissions and this restriction never applied. It has to be a
# top-level key, as it is now.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # jsdom@29 requires node ^20.19 || ^22.13 || >=24, so an 18.x leg
        # cannot run this suite at all. Dropped rather than left red.
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
