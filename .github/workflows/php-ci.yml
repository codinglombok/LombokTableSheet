name: PHP Port CI

on:
  push:
    branches: [main]
    paths: ['ports/php/**']
  pull_request:
    branches: [main]
    paths: ['ports/php/**']
  # Manual trigger: the path filters above mean a fix to this workflow file
  # itself never re-runs it, so a stale failure would stick to the README
  # badge indefinitely.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    defaults:
      run:
        working-directory: ports/php
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer, phpunit
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testdox tests
