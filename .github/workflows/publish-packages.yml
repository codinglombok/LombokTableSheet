# ──────────────────────────────────────────────────────────────────────────────
# LombokTableSheet — Publish to ALL 5 GitHub Packages Registries
# Triggered on release publish (same trigger as existing publish.yml).
# Publishes:
#   1. npm          → npm.pkg.github.com
#   2. Container    → ghcr.io
#   3. Maven        → maven.pkg.github.com (webjar)
#   4. NuGet        → nuget.pkg.github.com
#   5. RubyGems     → rubygems.pkg.github.com
#
# Does NOT replace: publish.yml → npm-publish.yml (npmjs.org)
# ──────────────────────────────────────────────────────────────────────────────
name: Publish GitHub Packages (All Registries)

on:
  release:
    types: [published]

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 0. Shared build artifact
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/
            package.json
            README.md
            LICENSE
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. npm → GitHub Packages
  # ═══════════════════════════════════════════════════════════════════════════
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@codinglombok'

      - name: Scope package for GPR
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.name = '@codinglombok/lomboktablesheet';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Container → ghcr.io
  # ═══════════════════════════════════════════════════════════════════════════
  publish-container:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/lomboktablesheet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist-built

      # Generate Dockerfile on-the-fly (repo doesn't have one)
      - name: Generate Dockerfile
        run: |
          cat > Dockerfile << 'DKEOF'
          FROM node:20-alpine AS build
          WORKDIR /app
          COPY package*.json tsconfig.json ./
          COPY src ./src
          RUN npm ci && npm run build

          FROM node:20-alpine
          WORKDIR /app
          COPY --from=build /app/dist ./dist
          COPY --from=build /app/package.json ./
          RUN mkdir -p node_modules/lomboktablesheet && \
              cp -r dist node_modules/lomboktablesheet/ && \
              cp package.json node_modules/lomboktablesheet/
          ENV NODE_ENV=production
          CMD ["node", "-e", "console.log('LombokTableSheet v' + require('./package.json').version + ' — import from dist/')"]
          DKEOF

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=LombokTableSheet — interactive data-table library
            org.opencontainers.image.licenses=Apache-2.0

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Maven → GitHub Packages (webjar)
  # ═══════════════════════════════════════════════════════════════════════════
  publish-maven:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist }

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Build webjar & deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          WJ="src/main/resources/META-INF/resources/webjars/lomboktablesheet/${VERSION}"

          mkdir -p "${WJ}"
          cp -r dist/* "${WJ}/"
          cp README.md LICENSE "${WJ}/"

          cat > pom.xml << POMEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   http://maven.apache.org/xsd/maven-4.0.0.xsd"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.github.codinglombok</groupId>
            <artifactId>lomboktablesheet</artifactId>
            <version>${VERSION}</version>
            <packaging>jar</packaging>
            <name>LombokTableSheet</name>
            <description>Interactive data-table library — webjar distribution</description>
            <url>https://github.com/codinglombok/LombokTableSheet</url>
            <licenses>
              <license>
                <name>Apache-2.0</name>
                <url>https://www.apache.org/licenses/LICENSE-2.0</url>
              </license>
            </licenses>
            <scm>
              <url>https://github.com/codinglombok/LombokTableSheet</url>
            </scm>
            <distributionManagement>
              <repository>
                <id>github</id>
                <url>https://maven.pkg.github.com/codinglombok/LombokTableSheet</url>
              </repository>
            </distributionManagement>
          </project>
          POMEOF

          mvn deploy -B -DskipTests

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. NuGet → GitHub Packages
  # ═══════════════════════════════════════════════════════════════════════════
  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist }

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.x'

      - name: Pack & push
        run: |
          VERSION="${{ needs.build.outputs.version }}"

          mkdir -p nuget-pkg/content/dist
          cp -r dist/* nuget-pkg/content/dist/
          cp README.md LICENSE nuget-pkg/

          cat > nuget-pkg/LombokTableSheet.csproj << CSPROJ
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <PackageId>codinglombok.LombokTableSheet</PackageId>
              <Version>${VERSION}</Version>
              <Authors>codinglombok</Authors>
              <Description>Interactive data-table library with plugins, i18n, statistics, and framework adapters (React/Vue)</Description>
              <PackageLicenseExpression>Apache-2.0</PackageLicenseExpression>
              <PackageProjectUrl>https://github.com/codinglombok/LombokTableSheet</PackageProjectUrl>
              <RepositoryUrl>https://github.com/codinglombok/LombokTableSheet</RepositoryUrl>
              <RepositoryType>git</RepositoryType>
              <PackageTags>table spreadsheet datatable interactive typescript</PackageTags>
              <PackageReadmeFile>README.md</PackageReadmeFile>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <NoBuild>true</NoBuild>
              <NoDefaultExcludes>true</NoDefaultExcludes>
            </PropertyGroup>
            <ItemGroup>
              <Content Include="content/**/*" PackagePath="content/" />
              <None Include="README.md" Pack="true" PackagePath="/" />
              <None Include="LICENSE" Pack="true" PackagePath="/" />
            </ItemGroup>
          </Project>
          CSPROJ

          cd nuget-pkg
          dotnet pack -o ../nupkg --no-build -p:NoBuild=true 2>/dev/null || \
            dotnet pack -o ../nupkg 2>/dev/null || true
          cd ..

          if ! ls nupkg/*.nupkg 2>/dev/null; then
            mkdir -p nupkg
            cd nuget-pkg && zip -r ../nupkg/codinglombok.LombokTableSheet.${VERSION}.nupkg . -x '.*' && cd ..
          fi

          dotnet nuget add source \
            --username codinglombok \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/codinglombok/index.json"

          dotnet nuget push "nupkg/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source github --skip-duplicate

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. RubyGems → GitHub Packages
  # ═══════════════════════════════════════════════════════════════════════════
  publish-rubygems:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist }

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'

      - name: Build & push gem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"

          mkdir -p gem-pkg/lib/lomboktablesheet/dist
          cp -r dist/* gem-pkg/lib/lomboktablesheet/dist/
          cp LICENSE README.md gem-pkg/

          cat > gem-pkg/lib/lomboktablesheet/version.rb << RB
          module LombokTableSheet
            VERSION = "${VERSION}"
          end
          RB

          cat > gem-pkg/lib/lomboktablesheet.rb << 'RB'
          require_relative "lomboktablesheet/version"

          module LombokTableSheet
            def self.dist_path
              File.join(File.dirname(__FILE__), "lomboktablesheet", "dist")
            end
            def self.esm_path  = File.join(dist_path, "index.js")
          end
          RB

          cat > gem-pkg/lomboktablesheet.gemspec << GEMSPEC
          require_relative "lib/lomboktablesheet/version"

          Gem::Specification.new do |s|
            s.name        = "lomboktablesheet"
            s.version     = LombokTableSheet::VERSION
            s.summary     = "Interactive data-table library"
            s.description = "TypeScript-first data-table with plugins, i18n (6 languages), ANOVA statistics, and React/Vue adapters"
            s.authors     = ["codinglombok"]
            s.homepage    = "https://github.com/codinglombok/LombokTableSheet"
            s.license     = "Apache-2.0"
            s.files       = Dir["lib/**/*", "LICENSE", "README.md"]
            s.require_paths = ["lib"]
            s.metadata    = {
              "source_code_uri" => "https://github.com/codinglombok/LombokTableSheet",
              "github_repo"     => "ssh://github.com/codinglombok/LombokTableSheet"
            }
            s.required_ruby_version = ">= 2.7.0"
          end
          GEMSPEC

          cd gem-pkg
          gem build lomboktablesheet.gemspec

          mkdir -p ~/.gem
          echo "---"                                > ~/.gem/credentials
          echo ":github: Bearer ${GITHUB_TOKEN}"   >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials

          gem push --key github \
            --host https://rubygems.pkg.github.com/codinglombok \
            "lomboktablesheet-${VERSION}.gem"
