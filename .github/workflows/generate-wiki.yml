name: Generate Wiki

on:
  push:
    branches: [main]
    paths:
      - 'ARCHITECTURE.md'
      - 'USAGE.md'
      - 'DETAILED_USAGE.md'
      - 'SECURITY.md'
      - 'PROJECT_SUMMARY.md'
      - 'DEPLOYMENT.md'
      - 'WORKFLOWS.md'
      - 'README.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stage docs for the wiki
        run: |
          mkdir -p wiki-src
          # Wiki pages are flat (no subfolders in page names), and "Home.md" is
          # the wiki's landing page — map README's role onto that convention.
          cp README.md wiki-src/Home.md
          # The `|| true` matters: `run:` uses `bash -e`, so a bare
          # `[ -f x ] && cp x` that tests false on the LAST iteration would
          # fail the whole step. The previous version only survived by
          # accident, because the last name in its list happened to exist.
          for f in ARCHITECTURE USAGE DETAILED_USAGE SECURITY PROJECT_SUMMARY DEPLOYMENT WORKFLOWS; do
            [ -f "$f.md" ] && cp "$f.md" "wiki-src/$f.md" || true
          done
          ls -1 wiki-src
      - name: Push staged docs to wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd wiki-src
          git init -b master
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git remote add origin "$WIKI_URL"

          # Pull existing wiki history so we amend, not force-push
          git fetch origin master && git reset origin/master 2>/dev/null || true

          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date — nothing to push."
          else
            git commit -m "Sync docs from repo @ ${GITHUB_SHA::7}"
            git push origin master
          fi
