name: Pages

on:
  push:
    branches: [main]
    # Include the workflow and its verifier: a fix to the deploy pipeline itself
    # must re-run the pipeline, or a stale broken deploy sticks around unnoticed.
    paths: ['examples/vanilla/**', 'src/**', 'README.md',
            '.github/workflows/pages.yml', 'scripts/verify-pages-site.mjs']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r examples/vanilla/* _site/
          mkdir -p _site/dist
          cp -r dist/* _site/dist/
          # examples/vanilla/index.html imports '../../dist/<subpath>' for local dev
          # (repo-root-relative); the Pages site layout is flatter, so rewrite to
          # './dist/...' in the copied artifact only — the source file is untouched.
          # Single-quoted with a '#' delimiter: no nested quoting, nothing for the
          # shell to mis-parse.
          sed -i 's#\.\./\.\./dist/#./dist/#g' _site/index.html
      - name: Verify the site would actually load
        run: node scripts/verify-pages-site.mjs _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
